<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" filter="url(#shadow)" />
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Prompt Command Symbol: > -->
  <path d="M 64 88 L 112 128 L 64 168" fill="none" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Prompt Underscore Cursor: _ -->
  <line x1="126" y1="168" x2="168" y2="168" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- AI Spark / Star Symbol -->
  <path d="M 184 64 C 184 80 196 92 212 92 C 196 92 184 104 184 120 C 184 104 172 92 156 92 C 172 92 184 80 184 64 Z" fill="url(#sparkGrad)" />
</svg>
