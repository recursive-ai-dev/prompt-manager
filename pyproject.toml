[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-manager"
version = "0.2.0"
description = "A powerful desktop prompt storage, organizer, and templating editor — 13 themes, reusable prompt templates, GitHub OAuth/PAT sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
keywords = ["prompt", "ai", "llm", "claude", "openai", "gemini", "templates", "github", "pyqt6", "kde", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "PyQt6>=6.4.0",
]

[project.scripts]
prompt-manager = "prompt_manager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_manager*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

