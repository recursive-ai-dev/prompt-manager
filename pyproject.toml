[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-manager"
dynamic = ["version"]
description = "A powerful desktop prompt storage, organizer, and templating editor — 13 themes, reusable prompt templates, GitHub OAuth/PAT sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
keywords = ["prompt", "ai", "llm", "claude", "openai", "gemini", "templates", "github", "pyqt6", "kde", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = [
    "PyQt6>=6.4.0",
    "keyring>=25.6.0",
]

[project.optional-dependencies]
# Compatibility extra for OS-native credential storage; keyring is also a
# required application dependency. Credentials have no local disk fallback.
keyring = ["keyring>=24.0"]
# Background removal for the theme-accent asset generator (dev/tooling only).
assets = ["Pillow>=10.0"]
# Standalone binary packaging.
build = ["pyinstaller>=6.0"]
# Test + development tooling.
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
prompt-manager = "prompt_manager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_manager*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "prompt_manager.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Start with correctness checks across the existing codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["prompt_manager/config.py", "prompt_manager/core/keychain.py"]
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true
