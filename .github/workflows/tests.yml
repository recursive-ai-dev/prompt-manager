name: Tests and static checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            qt: false
          - python: '3.13'
            qt: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install full application
        if: matrix.qt
        run: python -m pip install -e '.[dev]'
      - name: Install without Qt for headless regression coverage
        if: ${{ !matrix.qt }}
        run: |
          python -m pip install pytest keyring ruff mypy
          python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check prompt_manager tests
      - run: python -m mypy
